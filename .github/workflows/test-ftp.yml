name: Test FTPS connection

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/test-ftp.yml'

permissions:
  contents: read

jobs:
  check-connection:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Test secure FTP connection (read-only)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os, socket, sys
          from ftplib import FTP_TLS, all_errors
          host = os.environ.get("FTP_HOST","").strip()
          user = os.environ.get("FTP_USER","")
          password = os.environ.get("FTP_PASSWORD","")
          if not all((host, user, password)):
              print("ERROR: One or more required repository secrets are missing.")
              sys.exit(1)
          if host.startswith(("ftp://", "ftps://")):
              host = host.split("://", 1)[1]
          host = host.split("/", 1)[0]
          port = 21
          if ":" in host:
              host, value = host.rsplit(":", 1)
              port = int(value)
          try:
              with FTP_TLS(timeout=15) as ftp:
                  ftp.connect(host, port)
                  ftp.auth()
                  ftp.login(user, password)
                  ftp.prot_p()
                  ftp.voidcmd("NOOP")
                  print("SUCCESS: Encrypted FTPS connection and authentication verified.")
                  try:
                      entries = ftp.nlst()
                      print("SUCCESS: Read-only directory listing available ({} entries).".format(len(entries)))
                  except all_errors:
                      print("INFO: Authentication works, but directory listing is unavailable.")
                  ftp.quit()
          except (all_errors, OSError, ValueError) as exc:
              print("ERROR: FTPS connection failed ({}).".format(type(exc).__name__))
              sys.exit(1)
          PY
