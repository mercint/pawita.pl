name: Deploy Staffa gallery button via FTPS

on:
  workflow_dispatch:
  push:
    paths:
      - 'deploy/pawita-staffa-gallery.php'
      - '.github/workflows/deploy-staffa-gallery.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Upload isolated WordPress MU plugin (FTPS with curl)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os, sys, subprocess, urllib.parse
          host=os.environ.get('FTP_HOST','').strip()
          user=os.environ.get('FTP_USER','')
          password=os.environ.get('FTP_PASSWORD','')
          if not (host and user and password):
              sys.exit('ERROR: Missing FTP secrets')
          host=host.removeprefix('ftps://').removeprefix('ftp://').split('/')[0]
          if not host or any(c in host for c in '@?# '):
              sys.exit('ERROR: Invalid FTP host')
          base='ftp://'+host+'/'
          def call(relative='', upload=None):
              url=base+urllib.parse.quote(relative, safe='/')
              cmd=['curl','--ssl-reqd','--ftp-pasv','--fail','--silent',
                   '--connect-timeout','15','--max-time','45',
                   '--user',user+':'+password]
              if upload:
                  cmd+=['--ftp-create-dirs','--upload-file',upload]
              else:
                  cmd+=['--list-only']
              result=subprocess.run(cmd+[url],capture_output=True,text=True)
              return result
          # Scan a small bounded directory tree without exposing server filenames.
          from collections import deque
          queue=deque([('',0)])
          seen=set()
          root=None
          checks=0
          while queue and checks < 35:
              candidate,depth=queue.popleft()
              if candidate in seen:
                  continue
              seen.add(candidate)
              result=call(candidate)
              checks+=1
              if result.returncode!=0:
                  print('FTPS scan depth=%d curl=%d' % (depth,result.returncode),flush=True)
                  continue
              entries=[x.strip().rstrip('/').split('/')[-1] for x in result.stdout.splitlines()]
              names=set(entries)
              print('FTPS scan depth=%d entries=%d wp-content=%s wp-includes=%s wp-admin=%s' %
                    (depth,len(entries),'wp-content' in names,
                     'wp-includes' in names,'wp-admin' in names),flush=True)
              if {'wp-content','wp-includes','wp-admin'}.issubset(names):
                  root=candidate
                  break
              if depth>=2:
                  continue
              for name in entries:
                  if not name or name.startswith('.') or name in ('..','wp-content','wp-includes','wp-admin'):
                      continue
                  if not all(ch.isalnum() or ch in '-_.' for ch in name):
                      continue
                  if len(name)>80:
                      continue
                  queue.append((candidate+name+'/',depth+1))
          if root is None:
              sys.exit('ERROR: WordPress not identified after bounded FTPS scan. No files changed.')
          print('SUCCESS: FTPS directory listing works, WordPress root found.')
          mu=root+'wp-content/mu-plugins/'
          existing=call(mu)
          if existing.returncode not in (0,9,19,22,78):
              sys.exit('ERROR: Cannot verify plugin folder safely. No changes made.')
          filename='pawita-staffa-gallery.php'
          if existing.returncode==0 and filename in existing.stdout.splitlines():
              # Backup the current working plugin as a GitHub Actions local file.
              backup=subprocess.run(['curl','--ssl-reqd','--ftp-pasv','--fail','--silent',
                  '--connect-timeout','15','--max-time','45',
                  '--user',user+':'+password,
                  '--output','/tmp/pawita-staffa-gallery-backup.php',
                  base+urllib.parse.quote(mu+filename,safe='/')],capture_output=True)
              if backup.returncode!=0:
                  sys.exit('ERROR: Could not back up existing plugin; refusing to overwrite.')
              print('SUCCESS: Existing plugin backed up temporarily on runner.')
          result=call(mu+filename,upload='deploy/pawita-staffa-gallery.php')
          if result.returncode!=0:
              sys.exit('ERROR: FTPS upload failed (curl code %s).' % result.returncode)
          print('SUCCESS: Updated gallery button plugin uploaded to WordPress mu-plugins.')
          PY
