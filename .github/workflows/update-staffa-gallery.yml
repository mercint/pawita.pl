name: Aktualizacja galerii Domy na Staffa
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-staffa-gallery.yml'

permissions:
  contents: read

concurrency:
  group: staffa-gallery-update
  cancel-in-progress: false

jobs:
  gallery-update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
      - name: Skonfiguruj Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dopisz 12 zdjec do galerii Elementor
        env:
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_USERNAME: ${{ vars.WP_USERNAME || 'admin' }}
        run: python scripts/update_staffa_gallery.py
      - name: Zapisz kopie zapasowa i raport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staffa-gallery-backup
          path: output/
          if-no-files-found: ignore
          retention-days: 30
